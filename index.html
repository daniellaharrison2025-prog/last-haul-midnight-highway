
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Haul: Midnight Highway</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:14px;background:#111a29}
h1{font-size:23px;color:#e8c68a;margin:4px}
small{color:#aebed0}
main{max-width:1100px;margin:auto;padding:10px}
canvas{display:block;width:100%;background:#050810;border:2px solid #364559;border-radius:10px}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat{flex:1;min-width:105px;background:#1b293b;padding:10px;border-radius:8px}
.stat b{display:block;color:#7ee3df;font-size:20px;margin-top:5px}
#message{padding:13px;background:#202a3c;border-left:4px solid #c28b72;border-radius:5px;min-height:45px}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0}
button{background:#304761;color:#fff;border:1px solid #748ca6;border-radius:9px;padding:13px;font-weight:bold;touch-action:none}
button:active{background:#59758e}
p{color:#b9c6d7;text-align:center;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🚛 LAST HAUL: MIDNIGHT HIGHWAY</h1>
<small>Route 13 — The Watcher | Version 0.2</small>
</header>
<main>
<canvas id="game" width="960" height="540"></canvas>
<div class="hud">
<div class="stat">SPEED<b id="speed">0 MPH</b></div>
<div class="stat">FUEL<b id="fuel">100%</b></div>
<div class="stat">DELIVERY<b id="distance">8.0 MI</b></div>
<div class="stat">CONDITION<b id="health">100%</b></div>
</div>
<div id="message">DISPATCH: Midnight delivery. Stay on Route 13.</div>
<div class="controls">
<button data-key="left">◀ LEFT</button>
<button data-key="gas">▲ GAS</button>
<button data-key="brake">▼ BRAKE</button>
<button data-key="right">RIGHT ▶</button>
<button id="lights">💡 LIGHTS</button>
<button id="wipers">🌧 WIPERS</button>
<button id="restart">RESTART</button>
</div>
<p>MacBook: Arrow keys or WASD. Z Fold: Hold the touch buttons.</p>
</main>
<script>
const c=document.getElementById("game");
const x=c.getContext("2d");
const $=id=>document.getElementById(id);
const keys=new Set();
let t,finished,last=0,radioStage=0;
const rain=Array.from({length:100},()=>({
 x:Math.random()*960,y:Math.random()*540,
 length:8+Math.random()*19,speed:180+Math.random()*300
}));
function reset(){
 t={speed:0,fuel:100,health:100,distance:8,
 lane:0,road:0,time:0,lights:true,wipers:false};
 finished=false;radioStage=0;keys.clear();
 $("message").textContent="DISPATCH: Midnight delivery. Stay on Route 13.";
}
reset();
const mapping={
 ArrowLeft:"left",a:"left",A:"left",
 ArrowRight:"right",d:"right",D:"right",
 ArrowUp:"gas",w:"gas",W:"gas",
 ArrowDown:"brake",s:"brake",S:"brake"
};
window.addEventListener("keydown",e=>{
 if(mapping[e.key]){e.preventDefault();keys.add(mapping[e.key])}
});
window.addEventListener("keyup",e=>{
 if(mapping[e.key])keys.delete(mapping[e.key]);
});
window.addEventListener("blur",()=>keys.clear());
document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k);
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
  b.addEventListener(ev,()=>keys.delete(k)));
});
$("restart").onclick=reset;
$("lights").onclick=()=>t.lights=!t.lights;
$("wipers").onclick=()=>t.wipers=!t.wipers;

function end(msg){
 finished=true;t.speed=0;$("message").textContent=msg;
}
function update(dt){
 if(finished)return;
 t.time+=dt;
 t.speed+=keys.has("gas")?30*dt:-8*dt;
 if(keys.has("brake"))t.speed-=55*dt;
 t.speed=Math.max(0,Math.min(75,t.speed));
 const turn=(keys.has("right")?1:0)-(keys.has("left")?1:0);
 t.lane+=turn*dt*(0.4+t.speed/110);
 t.lane=Math.max(-2,Math.min(2,t.lane));
 if(Math.abs(t.lane)>0.95&&t.speed>12){
  t.health-=dt*(2+t.speed*0.18);
  t.speed=Math.max(0,t.speed-15*dt);
 }
 t.fuel-=dt*(t.speed*0.005+0.003);
 t.distance-=t.speed*dt/400;
 t.road+=t.speed*dt*0.015;
 if(t.distance<6&&radioStage===0){
  radioStage=1;
  $("message").textContent='RADIO: "Driver... do not look in the mirror."';
 }
 if(t.distance<3&&radioStage===1){
  radioStage=2;
  $("message").textContent="WARNING: Unidentified vehicle detected behind you.";
 }
 if(t.distance<=0)end("DELIVERY COMPLETE! Something followed you...");
 if(t.fuel<=0)end("OUT OF FUEL. Footsteps approach the cab...");
 if(t.health<=0)end("TRUCK DISABLED. The radio begins whispering...");
 $("speed").textContent=Math.round(t.speed)+" MPH";
 $("fuel").textContent=Math.max(0,Math.round(t.fuel))+"%";
 $("distance").textContent=Math.max(0,t.distance).toFixed(1)+" MI";
 $("health").textContent=Math.max(0,Math.round(t.health))+"%";
}
function draw(){
 const w=960,h=540,center=480-t.lane*150;
 const sky=x.createLinearGradient(0,0,0,h);
 sky.addColorStop(0,"#040813");
 sky.addColorStop(.6,"#182235");
 sky.addColorStop(1,"#0a1017");
 x.fillStyle=sky;x.fillRect(0,0,w,h);
 x.fillStyle="#0d1918";x.fillRect(0,255,w,285);

 // Road
 x.beginPath();
 x.moveTo(center-40,255);x.lineTo(center+40,255);
 x.lineTo(center+500,540);x.lineTo(center-500,540);
 x.closePath();x.fillStyle=t.lights?"#343b45":"#171c22";x.fill();

 // Lane markings
 for(let i=0;i<13;i++){
  const z=(i/13+t.road*.04)%1;
  const y=255+z*z*290;
  x.fillStyle="#e5c979";
  x.fillRect(center-3,y,6+z*3,8+z*22);
  for(const side of [-1,1]){
   const sx=center+side*(70+z*z*480);
   x.fillStyle="#172b25";
   x.fillRect(sx-10,y-20-z*60,20+z*12,40+z*80);
  }
 }

 // Mysterious headlights
 if(radioStage>=2){
  const pulse=0.6+Math.sin(t.time*4)*0.2;
  x.fillStyle=`rgba(255,70,60,${pulse})`;
  x.beginPath();x.arc(center-18,282,5,0,Math.PI*2);x.fill();
  x.beginPath();x.arc(center+18,282,5,0,Math.PI*2);x.fill();
 }

 // Headlight beam
 if(t.lights){
  const g=x.createRadialGradient(center,400,10,center,400,450);
  g.addColorStop(0,"rgba(255,230,160,.18)");
  g.addColorStop(1,"rgba(255,230,160,0)");
  x.fillStyle=g;x.fillRect(0,255,w,285);
 }else{
  x.fillStyle="rgba(0,0,0,.45)";x.fillRect(0,0,w,h);
 }

 // Rain
 x.strokeStyle="rgba(180,215,245,.45)";
 x.lineWidth=1.5;
 for(const r of rain){
  x.beginPath();x.moveTo(r.x,r.y);
  x.lineTo(r.x-6,r.y+r.length);x.stroke();
 }
 if(t.wipers){
  const a=Math.sin(t.time*5);
  x.strokeStyle="#1b242e";x.lineWidth=9;
  x.beginPath();x.moveTo(490,520);
  x.lineTo(490+Math.sin(a)*230,520-Math.cos(a)*230);
  x.stroke();
 }

 // Cab pillars
 x.fillStyle="#151c26";
 x.beginPath();
 x.moveTo(0,0);x.lineTo(105,0);x.lineTo(145,460);
 x.lineTo(80,500);x.closePath();x.fill();
 x.beginPath();
 x.moveTo(855,0);x.lineTo(960,0);x.lineTo(880,500);
 x.lineTo(815,460);x.closePath();x.fill();

 // Side mirrors
 x.fillStyle="#344454";
 x.fillRect(20,185,100,140);x.fillRect(840,185,100,140);
 x.fillStyle="#111b28";
 x.fillRect(27,193,86,124);x.fillRect(847,193,86,124);
 if(radioStage>=2){
  x.fillStyle="#b82424";
  x.fillRect(862,275,13,7);x.fillRect(901,275,13,7);
 }

 // Dashboard
 x.fillStyle="#111a26";
 x.beginPath();x.moveTo(0,455);
 x.quadraticCurveTo(480,415,960,455);
 x.lineTo(960,540);x.lineTo(0,540);x.fill();

 // Steering wheel
 x.strokeStyle="#61768b";x.lineWidth=12;
 x.beginPath();x.arc(480,570,115,Math.PI,Math.PI*2);x.stroke();
 x.fillStyle="#8de0dc";x.font="bold 24px Arial";
 x.fillText(Math.round(t.speed)+" MPH",430,495);

 x.fillStyle="#e5c98c";x.font="bold 21px Arial";
 x.fillText("ROUTE 13",165,42);
 x.font="16px Arial";x.fillText("12:47 AM",165,70);

 if(finished){
  x.fillStyle="rgba(0,0,0,.8)";x.fillRect(0,0,960,540);
  x.fillStyle="white";x.textAlign="center";
  x.font="bold 35px Arial";
  x.fillText(t.distance<=0?"DELIVERY COMPLETE":"GAME OVER",480,260);
  x.font="20px Arial";x.fillText("Press RESTART to play again",480,300);
  x.textAlign="left";
 }
}
function loop(time){
 const dt=Math.min(.05,(time-last)/1000||0);
 last=time;
 for(const r of rain){
  r.y+=r.speed*dt;r.x-=55*dt;
  if(r.y>540){r.y=-20;r.x=Math.random()*960}
  if(r.x<0)r.x=960;
 }
 update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
